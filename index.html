<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <main>
      <section>
        <!-- contenedor -->
        <div class="contenedor">
          <div class="pantalla">
            <p id="resultado">0</p>
          </div>
          
          <!-- Primera línea -->
          <div class="primera-linea">
            <button>C</button>
            <button>X</button>
            <button>%</button>
            <button>/</button>
          </div>

          <!-- Segunda línea -->
          <div class="segunda-linea">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
          </div>

          <!-- tercera linea -->
           <div class="tercera-linea">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
           </div>

           <!-- cuarta linea  -->
            <div class="cuarta-linea">
              <button>1</button>
              <button>2</button>
              <button>3</button>
              <button>+</button>
            </div>

            <!-- quinta linea  -->
             <div class="quinta-linea">
              <button>()</button>
              <button>0</button>
              <button>.</button>
              <button>=</button>
             </div>

        </div>

      </section>
    </main>
    <script  src="./js/app.js"></script>
  </body>
</html>
